name: Refresh literature screen

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: literature-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Harvest all sources
        run: python -u fetch_articles.py
      - name: Filter and deduplicate
        run: |
          python -u filter_articles.py
          python prepare_screening.py
      - name: Build page
        run: python build_site.py
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
